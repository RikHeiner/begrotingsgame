name: CI

on:
  push:
  pull_request:

jobs:
  controleren:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Formattering
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Data controleren
        run: npm run data:check
      - name: Unit tests (Vitest)
        run: npm test
      - name: Databasetests (Supabase-migraties op Postgres)
        run: npm run db:test
      - name: Build
        run: npm run build
      - name: Playwright-browser installeren
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (Playwright)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-resultaten
          path: |
            playwright-report/
            test-results/
          retention-days: 14
