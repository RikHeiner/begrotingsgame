# Netlify: bouwen en publiceren (zie docs/LANCERING.md). De beveiligingsheaders staan in dist/_headers.
[build]
  command = "npm run build"
  publish = "dist"
  # Alleen publiceren als de fractie erom vraagt: dan staat [netlify] in een van de nieuwe
  # commitberichten (zie scripts/netlify-overslaan.sh). Anders slaat Netlify de build over, zodat
  # niet elke wijziging tegoed kost. Met de hand gestart in Netlify bouwt hij altijd.
  ignore = "sh scripts/netlify-overslaan.sh"

[build.environment]
  # Het adres van de site, voor de deellinks en de afbeelding bij delen (WhatsApp, LinkedIn).
  VITE_SITE_URL = "https://begrotingsspel.nl"
  NODE_VERSION = "22"
