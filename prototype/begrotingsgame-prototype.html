<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Begrotingsgame gemeente Groningen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Asap:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--blue:#1233C4;--blue-soft:#E8ECFB;--orange:#FF6A00;--orange-soft:#FFF0E5;--ink:#15193A;--muted:#5A5F7D;--line:#D9DDEE;--bg:#F6F7FC;--card:#FFFFFF;--pos:#15875A;--neg:#C4321E;--lockbg:#EEF0F6;
--grass:#A9DB8A;--grass2:#98D077;--road:#C9B99A;--roadline:#F4F5FA;--sky:#CFE6FF;--water:#4A9FD8;--water-bg:#E3EEF9;--wline:rgba(255,255,255,.7)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--blue:#8198FF;--blue-soft:#1B2250;--orange:#FF8A33;--orange-soft:#3A2210;--ink:#EEF0FA;--muted:#A5AACB;--line:#2C3363;--bg:#0F1330;--card:#171C42;--pos:#43C28A;--neg:#FF7B66;--lockbg:#1F2550;--grass:#3F6B3A;--grass2:#355D31;--road:#4A4F66;--roadline:#8A8FA8;--water:#4A8FC6;--water-bg:#131A40;--wline:rgba(255,255,255,.15)}}
:root[data-theme="dark"]{--blue:#8198FF;--blue-soft:#1B2250;--orange:#FF8A33;--orange-soft:#3A2210;--ink:#EEF0FA;--muted:#A5AACB;--line:#2C3363;--bg:#0F1330;--card:#171C42;--pos:#43C28A;--neg:#FF7B66;--lockbg:#1F2550;--grass:#3F6B3A;--grass2:#355D31;--road:#4A4F66;--roadline:#8A8FA8;--water:#4A8FC6;--water-bg:#131A40;--wline:rgba(255,255,255,.15)}
html{height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Asap",system-ui,sans-serif;line-height:1.45;font-variant-numeric:tabular-nums;overscroll-behavior:none}
h1,h2,.fun{font-family:"Baloo 2","Asap",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.hidden{display:none!important}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.btn{border:0;background:var(--orange);color:#fff;border-radius:14px;padding:11px 20px;font-weight:700;box-shadow:0 4px 0 #B84C00}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #B84C00}
.btn.ghost{background:var(--card);color:var(--blue);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* START */
#start{padding:36px 0 50px}
#start h1{font-size:clamp(2.6rem,11vw,4rem);line-height:.95;margin:0 0 14px;color:var(--blue);font-weight:800}
#start p{max-width:56ch;color:var(--muted);margin:0 0 12px}
.big{font-size:1.1rem;color:var(--ink)!important}
.missions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0}
@media(max-width:560px){.missions{grid-template-columns:1fr}}
.mission{text-align:left;background:var(--card);border:3px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 5px 0 var(--line)}
.mission:hover{border-color:var(--blue)}
.mission b{display:block;font-family:"Baloo 2",sans-serif;font-size:1.25rem;margin-bottom:2px}
.mission span{color:var(--muted);font-size:.92rem}
.mission .ico{font-size:1.9rem;display:block}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--card);border-bottom:3px solid var(--line)}
.hud .top{display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:10px;align-items:center;padding-top:8px;padding-bottom:8px}
.pot{width:46px;height:54px}
.pot svg{width:100%;height:100%;display:block}
.lock{transition:transform .55s cubic-bezier(.5,-.4,.4,1.4),opacity .4s}
.pot.open .lock{transform:translate(20px,-24px) rotate(30deg);opacity:0}
.pot.shake{animation:shake .4s}
.pot.bump{animation:bump .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes bump{50%{transform:scale(1.15)}}
.fill{transition:height .45s,y .45s}
.stat small{display:block;font-size:.72rem;color:var(--muted);line-height:1.1}
.stat strong{white-space:nowrap;font-family:"Baloo 2",sans-serif;font-size:1.05rem;font-weight:800;line-height:1.1}
.missionbar{font-size:.82rem;padding:5px 0 7px;border-top:1px dashed var(--line);color:var(--muted);display:flex;justify-content:space-between;gap:8px;align-items:center}
.missionbar b{color:var(--ink)}.mbtn{background:none;border:0;padding:0;text-align:left;color:var(--muted);font-size:.82rem}.mbtn::after{content:" ▾";color:var(--blue)}
.missionbar .btn{padding:6px 12px;font-size:.85rem;box-shadow:0 3px 0 #B84C00}

/* CITY */
.cityWrap{position:relative;max-width:560px;margin:10px auto 0}
#city{width:100%;height:auto;display:block;border-radius:22px;background:var(--water-bg);touch-action:manipulation}
.bld{cursor:pointer}
.bld:focus{outline:none}
.bld:focus-visible .base{stroke:var(--orange);stroke-width:4}
.bld .shade{transition:opacity .5s}
.bld.sad .body{filter:grayscale(.85) brightness(.85)}
.bld .closed,.bld .spark{opacity:0;transition:opacity .4s}
.bld.closedB .closed{opacity:1}
.bld.happy .spark{opacity:1}

@keyframes twinkle{50%{transform:translateY(-3px)}}
.bld.pulse .inner{animation:pulse .5s}
@keyframes pulse{50%{transform:scale(.56)}}
.bld text.lbl{font:700 19px "Asap",sans-serif;paint-order:stroke;stroke:var(--card);stroke-width:5px;fill:var(--ink);text-anchor:middle}
.bld text.amt{font:800 17px "Asap",sans-serif;paint-order:stroke;stroke:var(--card);stroke-width:5px;text-anchor:middle}
.walker{transition:none}.wlbl{font:600 8px "Asap",sans-serif;fill:#3B5A2E;text-anchor:middle;opacity:.8}
.intro{max-width:560px;margin:12px auto 0;padding:0 16px}.intro h1{font-size:clamp(1.7rem,7vw,2.4rem);line-height:1;color:var(--blue);margin:0 0 6px}.intro p{margin:0;color:var(--muted)}
.bubble{position:absolute;background:var(--card);color:var(--ink);border:2px solid var(--ink);border-radius:14px;padding:6px 10px;font-size:.82rem;font-weight:600;max-width:190px;pointer-events:none;transform:translate(-50%,-100%);animation:pop .25s ease;box-shadow:0 3px 0 rgba(0,0,0,.15);z-index:3}
.bubble::after{content:"";position:absolute;left:50%;bottom:-8px;border:7px solid transparent;border-top-color:var(--ink);transform:translateX(-50%)}
@keyframes pop{from{transform:translate(-50%,-80%) scale(.6);opacity:0}}
.coin{position:fixed;z-index:40;font-size:22px;pointer-events:none}
.tapHint{text-align:center;color:var(--muted);font-size:.88rem;margin:10px 0 0}
.happyRow{display:flex;align-items:center;gap:10px;justify-content:center;margin:12px 0 30px}
.happyRow .face{font-size:2rem}
.happyRow .hb{width:160px;height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.happyRow .hb div{height:100%;background:var(--pos);transition:width .5s}

/* SHEET */
.sheetBg{position:fixed;inset:0;background:rgba(10,14,40,.45);z-index:20;opacity:0;pointer-events:none;transition:opacity .25s}
.sheetBg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:22px 22px 0 0;max-height:78vh;overflow:auto;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);padding:0 0 calc(env(safe-area-inset-bottom,0px) + 16px)}
.sheet.on{transform:none}.sheet:not(.on){visibility:hidden;transition:transform .3s,visibility 0s .3s}
.sheet .sh{position:sticky;top:0;background:var(--card);padding:14px 18px 10px;border-bottom:2px solid var(--line);display:flex;align-items:center;gap:12px;z-index:2}
.sheet .sh .e{font-size:2rem}
.sheet .sh h2{margin:0;font-size:1.4rem;line-height:1}
.sheet .sh small{color:var(--muted)}
.sheet .x{margin-left:auto;background:var(--lockbg);border:0;border-radius:50%;width:38px;height:38px;font-size:1.2rem}
.sheet .inner{max-width:720px;margin:0 auto;padding:4px 16px}
.hint{color:var(--muted);font-size:.9rem;margin:10px 0 4px}
.it{border-top:1px solid var(--line);padding:12px 2px 10px}
.it:first-of-type{border-top:0}
.it .h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.it .n{font-weight:600;line-height:1.25}
.it .v{font-weight:800;white-space:nowrap;font-size:.95rem}
.it .sub{font-size:.8rem;color:var(--muted);margin-top:2px}
.it input[type=range]{width:100%;margin:10px 0 2px;accent-color:var(--orange);height:28px}
.scale{display:flex;justify-content:space-between;font-size:.68rem;color:var(--muted)}
.it .msg{font-size:.86rem;margin-top:6px;display:none}
.it.changed .msg{display:block}
.it.cut .msg{color:var(--neg)}
.it.up .msg{color:var(--pos)}
.it.locked{opacity:.75}
.it.locked .lockmsg{font-size:.82rem;color:var(--muted);background:var(--lockbg);border-radius:6px;padding:6px 8px;margin-top:8px}
.badge{display:inline-block;font-size:.68rem;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--orange-soft);color:var(--orange);margin-left:6px;vertical-align:1px}
.pass{background:var(--blue-soft);color:var(--blue)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
@media(max-width:560px){.cards{grid-template-columns:1fr}}
.card{background:var(--card);border:3px solid var(--line);border-radius:16px;padding:12px;text-align:left;position:relative;box-shadow:0 4px 0 var(--line)}
.card.on{border-color:var(--orange);background:var(--orange-soft)}
.card .k{font-size:.72rem;font-weight:700;color:var(--muted)}
.card b{display:block;margin:4px 0 6px;line-height:1.25}
.card .d{font-size:.86rem;color:var(--muted)}
.card .a{font-weight:800;margin-top:8px}
.card.on::after{content:"✓";position:absolute;top:8px;right:12px;color:var(--orange);font-weight:800;font-size:1.2rem}
h3.sec{margin:18px 0 0;font-size:1.05rem}

/* toast */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:30;width:min(92vw,520px);display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:11px 14px;border-radius:14px;font-size:.92rem;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:tin .3s ease}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}

/* result */
#result{padding:30px 16px 60px}
#result h1{font-size:clamp(2rem,8vw,3rem);line-height:1;color:var(--blue);margin:0 0 10px;font-weight:800}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.bdg{border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:600;font-size:.9rem}
.bdg.got{border-color:var(--orange);background:var(--orange-soft)}
.bdg.no{opacity:.45}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
.panel h2{margin:0 0 8px;font-size:1.2rem}
.panel ul{margin:0;padding-left:18px}.panel li{margin:3px 0}
.rm{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:560px){.rm{grid-template-columns:repeat(2,1fr)}}
.mt .e{font-size:1rem;display:block}
.mt .bar{height:6px;border-radius:3px;background:var(--blue-soft);margin-top:4px;overflow:hidden}
.mt .bar div{height:100%;background:var(--blue)}
.submit{margin:24px 0;display:flex;gap:10px;flex-wrap:wrap}
.tin{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;background:var(--bg);color:var(--ink);margin:2px 0 10px}
.tbpanel{border:3px solid var(--orange)}
.doctools{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 6px}
/*doc*/
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;background:var(--bg);color:var(--ink)}
.note{font-size:.8rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>



<div id="game">
  <div class="hud" role="status" aria-live="polite">
    <div class="wrap">
      <div class="top">
        <div class="pot" id="pot" title="Het geldpotje">
          <svg viewBox="0 0 60 70" aria-hidden="true">
            <defs><clipPath id="jar"><path d="M12 22 Q8 24 8 32 L8 60 Q8 66 14 66 L46 66 Q52 66 52 60 L52 32 Q52 24 48 22 Z"/></clipPath></defs>
            <rect x="14" y="14" width="32" height="8" rx="2" fill="var(--blue)"/>
            <path d="M12 22 Q8 24 8 32 L8 60 Q8 66 14 66 L46 66 Q52 66 52 60 L52 32 Q52 24 48 22 Z" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="2.5"/>
            <rect class="fill" id="potfill" x="0" y="66" width="60" height="0" fill="#FFC53D" clip-path="url(#jar)"/>
            <g class="lock"><path d="M23 16 V10 a7 7 0 0 1 14 0 V16" fill="none" stroke="var(--ink)" stroke-width="3"/><rect x="19" y="15" width="22" height="16" rx="3" fill="var(--ink)"/><circle cx="30" cy="23" r="2.5" fill="var(--card)"/></g>
          </svg>
        </div>
        <div class="stat"><small>Pot, elk jaar</small><strong id="sS">€ 0</strong></div>
        <div class="stat"><small>Eenmalig</small><strong id="sI">€ 0</strong></div>
        <div class="stat"><small>Blije Groningers</small><strong id="sH">50%</strong></div>
      </div>
      <div class="missionbar"><button id="missionbar" class="mbtn" aria-label="Missie kiezen"></button><button class="btn" id="submitTop">Indienen</button></div>
    </div>
  </div>

  <div class="intro"><h1>Maak de begroting van de gemeente Groningen</h1><p>Jij beheert € 1.482 miljoen. Tik op een gebouw en kies waar het geld heen gaat. Het geldpotje zit op slot tot je eerst ergens bezuinigt.</p></div>
  <div class="cityWrap" id="cityWrap">
    <svg id="city" viewBox="0 0 360 560" role="img" aria-label="Kaart van de gemeente Groningen met gebouwen"></svg>
  </div>
  <p class="tapHint">Tik op een gebouw om de begroting ervan aan te passen.</p>
  <div class="happyRow"><span class="face" id="face">🙂</span><div class="hb"><div id="hbar" style="width:50%"></div></div><button class="btn ghost" id="reset">Opnieuw</button></div>
  <p class="tapHint" id="submitWhy" style="color:var(--neg);margin-bottom:40px"></p>
</div>

<div class="sheetBg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle">
  <div class="sh"><span class="e" id="shE"></span><div><h2 id="shTitle"></h2><small id="shSub"></small></div><button class="x" id="shClose" aria-label="Sluiten">✕</button></div>
  <div class="inner" id="shBody"></div>
</div>

<section id="result" class="wrap hidden"></section>
<div id="toasts" aria-live="polite"></div>

<script>
// ============ DATA (bedragen x € mln, ontwerpbegroting 2026) ============
// l = lasten, b = gekoppelde baten, min/max in %, lock = vaste of wettelijke post
// m = gemeentemeters: v veiligheid, s schoon&heel, z zorg&vangnet, w werk, c cultuur&sport
const PROG=[
{n:"Economie en ruimte",items:[
 {id:"e1",n:"Economische agenda",l:1.4,m:{w:.5},stop:"Minder projecten en evenementen om bedrijven te helpen en aan te trekken."},
 {id:"e2",n:"Ambtenaren economische zaken",l:2.9,min:-50,m:{w:.3},stop:"Minder mensen die bedrijven helpen bij vestiging en groei."},
 {id:"e3",n:"Citymarketing en economische activiteiten",l:2.25,m:{w:.3},stop:"Minder promotie van Groningen, o.a. via Marketing Groningen."},
 {id:"e4",n:"Akkoord van Groningen (RUG, Hanze, UMCG)",l:1.25,b:.75,m:{w:.3},stop:"De gemeente stapt (deels) uit de samenwerking met kennisinstellingen. Partners betalen dan ook niet meer mee."},
 {id:"e5",n:"Markten, havens en brugbediening",l:2.5,b:1.3,min:-40,m:{w:.2},stop:"Minder markten en kortere bedieningstijden van bruggen. Je mist ook marktgelden."},
 {id:"e6",n:"Bedrijventerreinen en winkelcentra",l:1.545,m:{w:.4},stop:"Minder geld om bedrijventerreinen en wijkwinkelcentra op te knappen."},
 {id:"e7",n:"Strategisch bezit (panden en grond)",l:9.8,b:5.9,min:-50,stop:"De gemeente houdt minder panden aan. Minder kosten, maar ook minder huurinkomsten."},
 {id:"e8",n:"Suikerzijde (gebiedsontwikkeling)",l:3.84,min:-50,stop:"De ontwikkeling van de Suikerzijde gaat langzamer."},
 {id:"e9",n:"Regio Groningen-Assen",l:1.6,stop:"Groningen doet minder mee aan de regionale samenwerking."},
 {id:"e10",n:"Ambtenaren gebiedsontwikkeling",l:6.8,min:-50,stop:"Minder mensen voor grote bouwprojecten en gebiedsontwikkeling."},
 {id:"e11",n:"Rente en afschrijving (o.a. Meerstad)",l:10.7,lock:"Dit zijn vaste kosten van investeringen die al gedaan zijn. Die kun je niet meer schrappen."}
]},
{n:"Verkeer en parkeren",items:[
 {id:"m2",n:"Parkeercontrole",l:5.0,b:6.0,max:50,m:{v:.2},stop:"Minder controle. Let op: je mist dan ook naheffingen, dus dit kost je geld."},
 {id:"m3",n:"Extra geld mobiliteit",l:5.28,m:{s:.2},stop:"Minder nieuwe fietspaden, oversteekplaatsen en verkeersmaatregelen."},
 {id:"m4",n:"Uitvoering mobiliteitsvisie",l:1.5,stop:"De plannen uit de mobiliteitsvisie gaan langzamer."},
 {id:"m5",n:"Fietsenstallingen centrum",l:.5,max:100,m:{s:.2},stop:"Kortere openingstijden van fietsenstallingen.",up:"Langer open, eventueel 24/7."},
 {id:"m6",n:"Binnenstadsprogramma",l:2.06,m:{s:.2},stop:"Minder vernieuwing van straten en pleinen in het centrum."},
 {id:"m7",n:"Stationsgebied",l:.988,stop:"De plannen voor het stationsgebied gaan langzamer."},
 {id:"m9",n:"Oosterhamrikzone",l:.25,stop:"Stoppen met planvorming; de busbaan wordt niet verlegd."},
 {id:"m11",n:"Ambtenaren mobiliteit",l:3.1,min:-50,stop:"Minder mensen voor verkeersplannen."},
 {id:"m10",n:"Rente en afschrijving wegen",l:6.1,lock:"Vaste kosten van eerder aangelegde wegen en bruggen."}
]},
{n:"Wonen en bouwen",items:[
 {id:"w1",n:"Extra geld wonen",l:1.775,m:{w:.1},stop:"Minder extra inzet op woningbouw."},
 {id:"w2",n:"Meer betaalbare woningen",l:1.2,stop:"Minder steun voor betaalbare huur- en koopwoningen."},
 {id:"w3",n:"Goed verhuurderschap",l:1.25,b:.5,m:{v:.1},stop:"Minder controle op huisjesmelkers."},
 {id:"w4",n:"Ambtenaren wonen",l:4.6,min:-50,stop:"Minder mensen voor woningbouwprojecten."},
 {id:"w6",n:"Energiesubsidies",l:12.0,b:11.7,stop:"Minder subsidies voor isolatie en verduurzaming. Het meeste geld komt van het Rijk, dus je bespaart maar weinig."},
 {id:"w7",n:"Extra geld energietransitie",l:2.275,stop:"Minder gemeentelijke projecten voor de energietransitie."},
 {id:"w8",n:"Omgevingsvergunningen",l:10.5,b:17.9,min:-50,max:50,stop:"Minder vergunningverleners: langere wachttijden en je mist leges. Dit kost je dus geld.",up:"Snellere vergunningen, en meer leges."},
 {id:"w10",n:"Toezicht op bouwen",l:2.1,m:{v:.2},stop:"Minder controle op bouwplaatsen en illegale bouw."},
 {id:"w11",n:"Verduurzamen gemeentegebouwen",l:1.3,stop:"Gemeentegebouwen worden langzamer verduurzaamd."}
]},
{n:"Openbare ruimte",items:[
 {id:"o1",n:"Onderhoud straten, groen en speeltuinen",l:66.4,b:1.9,min:-50,max:25,m:{s:1},stop:"Minder maaien, vegen en repareren. Wie te lang wacht, betaalt later meer.",up:"Een beter onderhouden openbare ruimte in alle wijken."},
 {id:"o3",n:"Afvalinzameling huishoudens",l:36.8,b:41.4,lock:"Wordt volledig betaald uit de afvalstoffenheffing. Minder doen levert de begroting niets op; alleen de heffing gaat omlaag.",pass:1},
 {id:"o2",n:"Riolering",l:22.5,b:23.7,lock:"Wordt volledig betaald uit de rioolheffing.",pass:1},
 {id:"o4",n:"Bedrijfsafval inzamelen",l:7.6,b:9.1,stop:"De gemeente stopt met bedrijfsafval; ondernemers kiezen een eigen inzamelaar. Je mist de inkomsten, dus dit kost geld."},
 {id:"o5",n:"Autowerkplaats voor derden",l:.9,b:.9,stop:"De gemeente repareert geen auto's meer voor anderen. Kosten en inkomsten vallen tegen elkaar weg."},
 {id:"o6",n:"Leefkwaliteit (groen en spelen in wijken)",l:4.5,m:{s:.5},stop:"Minder nieuw groen en minder nieuwe speelplekken."},
 {id:"o8",n:"Geo en data",l:1.1,stop:"Minder kaarten en data over de gemeente."}

const ITEMS={}; PROG.forEach(p=>p.items.forEach(i=>{i.prog=p.n;ITEMS[i.id]=i}));
let st={pct:{},tax:{},cards:new Set(),mission:null}, tab="uit", openProg=new Set([0]), warned=new Set();

const net=i=>i.l-(i.b||0);
function steps(i){const mn=i.min??-100,mx=i.max??25;return [-100,-75,-50,-40,-25,-20,-10,0,10,20,25,50,100].filter(x=>x>=mn&&x<=mx)}

function calc(s=st){
  let S=0,I=0,chains=[];
  for(const id in s.pct){const i=ITEMS[id],p=s.pct[id]/100; S+=-p*net(i);}
  // kettingeffecten
  const rp=(s.pct.s3||0)/100; if(rp){const x=rp*ITEMS.s3.l*REINT; S+=x; chains.push({t:"Bijstand",v:x});}
  const sp=(s.pct.s9||0)/100; if(sp<0){const x=sp*-ITEMS.s9.l*SCHULD; S-=x; chains.push({t:"Extra bijzondere bijstand",v:-x});}
  for(const id in s.tax){const t=TAX.find(x=>x.id===id); S+=s.tax[id]/100*t.r;}
  for(const id of s.cards){const c=CARDS.find(x=>x.id===id); if(c.t==="S")S+=c.s; else I+=c.s;}
  return {S:Math.round(S*1000)/1000,I:Math.round(I*1000)/1000,chains};
}
function meters(s=st){
  const out={};
  for(const M of METERS){ if(M.k==="p") continue;
    let T=0,D=0;
    for(const id in ITEMS){const i=ITEMS[id],w=i.m?.[M.k]; if(!w||i.lock) continue; T+=i.l*w; D+=i.l*w*((s.pct[id]||0)/100);}
    let v=50+ (T?D/T*120:0);
    if(M.k==="z"&&s.pct.s3>0) v+=s.pct.s3/10; // meer mensen aan het werk
    for(const id of s.cards){const c=CARDS.find(x=>x.id===id); if(c.m?.[M.k]) v+=c.m[M.k];}
    out[M.k]=Math.max(0,Math.min(100,v));
  }
  let T=0,D=0; for(const t of TAX){T+=t.r*t.p; D+=t.r*t.p*((s.tax[t.id]||0)/100);}
  let pv=50 - D/T*150; if(s.cards.has("k_kwijt")) pv-=3;
  out.p=Math.max(0,Math.min(100,pv));
  return out;
}

// wandelaars lopen over de wegen tussen stadhuis en de gebouwen
let WALK=[];
function initWalk(){WALK=[0,1,2,3,4,5,6,7].map(i=>{const r=i%ROADS.length;return {r,t:Math.random(),v:(0.0012+Math.random()*0.0018)*(Math.random()<.5?-1:1),x:0,y:0}});}
function walk(){
  WALK.forEach((w,i)=>{const p=document.getElementById("r"+w.r); if(!p) return;
    w.t+=w.v; if(w.t>1||w.t<0){ w.v=-w.v; w.t=Math.max(0,Math.min(1,w.t)); if(w.t===0&&Math.random()<.6) w.r=Math.floor(Math.random()*ROADS.length);}
    const L=p.getTotalLength(), pt=p.getPointAtLength(L*w.t); const dx=w.x?pt.x-w.x:0; w.x=pt.x; w.y=pt.y;
    const el=document.getElementById("p"+i); if(el) el.setAttribute("transform",`translate(${pt.x.toFixed(1)} ${(pt.y+Math.abs(Math.sin(w.t*200))*0.8).toFixed(1)}) scale(${dx<0?-1:1} 1)`);});
  requestAnimationFrame(walk);
}

}

// gebouwstatus
function bScore(b){
  if(b.tax){let s=0;TAX.forEach(t=>s+= (st.tax[t.id]||0)*t.r); return {sc:0,money:TAX.reduce((a,t)=>a+(st.tax[t.id]||0)/100*t.r,0)};}
  if(b.cards){let m=0;CARDS.forEach(c=>{if(st.cards.has(c.id))m+=c.s});return {sc:0,money:m};}
  let T=0,D=0,m=0; b.ids.forEach(id=>{const i=ITEMS[id]; if(i.lock) return; T+=i.l; D+=i.l*(st.pct[id]||0); m+=-(st.pct[id]||0)/100*net(i);});
  return {sc:T?D/T:0,money:m};
}
function updCity(){
  B.forEach(b=>{ if(b.decor) return; const g=document.getElementById("b-"+b.id), {sc,money}=bScore(b);
    let sad=sc<-4, closed=sc<=-30, happy=sc>3;
    if(b.tax){const o=st.tax.t1||0; happy=o<0; sad=o>0;}
    if(b.cards){happy=[...st.cards].some(id=>CARDS.find(c=>c.id===id).g==="uit");}
    g.classList.toggle("sad",sad); g.classList.toggle("closedB",closed); g.classList.toggle("happy",happy);
    g.querySelectorAll(".win").forEach((w,k)=>w.setAttribute("fill", sad && k%(closed?1:2)===0 ? "#5C6070":"#FFE27A"));
    const sh=g.querySelector(".shade"); if(sh) sh.setAttribute("opacity", sad?1:0);
    const a=document.getElementById("amt-"+b.id); a.textContent=Math.abs(money)>0.0005?fmt(money):""; a.setAttribute("fill",money>0?"var(--pos)":"var(--neg)");
  });
}

function toast(msg){const d=document.createElement("div");d.className="toast";d.textContent=msg;const box=document.getElementById("toasts");box.appendChild(d);setTimeout(()=>d.remove(),4200);while(box.children.length>3)box.firstChild.remove();}
function potFx(cls){const p=document.getElementById("pot");p.classList.remove("shake","bump");void p.offsetWidth;p.classList.add(cls);}
function coins(fromEl,n){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches||!fromEl) return;
  const a=fromEl.getBoundingClientRect(), b=document.getElementById("pot").getBoundingClientRect();
  for(let k=0;k<Math.min(n,6);k++){const c=document.createElement("div");c.className="coin";c.textContent="🪙";document.body.appendChild(c);
    const sx=a.left+a.width/2+(Math.random()*40-20), sy=a.top+a.height/2;
    c.animate([{transform:`translate(${sx}px,${sy}px) scale(1)`},{transform:`translate(${(sx+b.left)/2}px,${Math.min(sy,b.top)-60}px) scale(1.2)`},{transform:`translate(${b.left+10}px,${b.top+10}px) scale(.5)`,opacity:.3}],{duration:700+k*90,easing:"ease-in"}).onfinish=()=>{c.remove();potFx("bump")};}
}
let lastS=0, curB=null;
function hud(){
  const {S,I}=calc(), m=meters();
  const eS=document.getElementById("sS"),eI=document.getElementById("sI");
  eS.textContent=fmt(S); eS.className=S>0.0005?"pos":S<-0.0005?"neg":"";
  eI.textContent=fmt(I); eI.className=I>0.0005?"pos":I<-0.0005?"neg":"";
  document.getElementById("pot").classList.toggle("open",S>0.0005);
  const h=Math.min(1,Math.max(0,S)/30)*44,f=document.getElementById("potfill"); f.setAttribute("height",h); f.setAttribute("y",66-h);
  const hap=Object.values(m).reduce((a,v)=>a+v,0)/6;
  document.getElementById("sH").textContent=Math.round(hap)+"%";
  document.getElementById("hbar").style.width=hap+"%";
  document.getElementById("face").textContent=hap>62?"😄":hap>52?"🙂":hap>42?"😐":hap>32?"🙁":"😠";
  const mi=MISSIONS.find(x=>x.id===st.mission), ok=mi.check(st,m)&&S>=-0.0005&&S+I>=-0.0005;
  document.getElementById("missionbar").innerHTML=`${mi.ico} <b>${mi.n}</b> · ${mi.prog(st,m)} ${ok&&mi.id!=="vrij"?"✅":""}`;
  const why=S<-0.0005?"Je begroting is structureel niet sluitend: elk jaar "+fmt(-S).replace("− ","")+" tekort.":(S+I<-0.0005?"Je komt dit jaar "+fmt(-(S+I)).replace("− ","")+" tekort.":"");
  document.getElementById("submitWhy").textContent=why; document.getElementById("submitTop").disabled=!!why;
  updCity();
  return S;
}

  const s=steps(i),cur=st.pct[i.id]||0,legal=(i.min??-100)>-25?'<span class="badge">wettelijke taak</span>':'';
  return `<div class="it" id="it-${i.id}"><div class="h"><div class="n">${i.n}${legal}</div><div class="v" id="v-${i.id}"></div></div>
   <div class="sub">€ ${i.l.toLocaleString("nl-NL")} mln per jaar${i.b?` · €&nbsp;${i.b.toLocaleString("nl-NL")} mln aan inkomsten hangt ermee samen`:''}</div>

function updTax(t){const cur=st.tax[t.id]||0,el=document.getElementById("v-"+t.id); if(!el)return; const v=cur/100*t.r; el.innerHTML=cur===0?`<span style="color:var(--muted)">0%</span>`:`${cur>0?"+":""}${cur}% · <span class="${v>=0?'pos':'neg'}">${fmt(v,2)}</span>`}

function allowed(n){const a=calc(st),b=calc(n); if(b.S<-0.0005&&b.S<a.S) return false; if(b.S+b.I<-0.0005&&b.S+b.I<a.S+a.I) return false; return true;}
function clone(){return {pct:{...st.pct},tax:{...st.tax},cards:new Set(st.cards),mission:st.mission}}
function chainToasts(id,old,now){
  if(id==="s3"&&now>0&&old<=0) toast("🔗 Meer mensen aan het werk: minder bijstand nodig. ⚠︎ Voorbeeld: 30 cent terug per extra euro.");
  if(id==="s3"&&now<0&&old>=0) toast("🔗 Minder begeleiding naar werk: meer mensen blijven in de bijstand.");
  if(id==="s9"&&now<0&&old>=0) toast("🔗 Minder schuldhulp: meer aanvragen voor bijzondere bijstand.");
  if(id==="o1"&&now<=-25&&old>-25) toast("🚧 Achterstallig onderhoud: later wordt herstel duurder.");
  if(id==="k1"&&now<=-50&&old>-50) toast("🏊 Deze bezuiniging kan alleen als er een zwembad of sporthal dichtgaat.");
  if(id==="h1"&&now<=-20&&old>-20) toast("🏢 20% minder overhead: honderden banen minder bij de gemeente.");
  if(id==="w8"&&now<0&&old>=0) toast("🔗 Minder vergunningverleners: je mist leges, dus dit kost netto geld.");
  if(id==="m2"&&now<0&&old>=0) toast("🔗 Minder parkeercontrole: minder naheffingen, dus dit kost geld.");

document.addEventListener("input",e=>{
  const r=e.target; if(r.type!=="range") return; const before=calc().S;
  if(r.dataset.id){const id=r.dataset.id,s=steps(ITEMS[id]),v=s[+r.value],old=st.pct[id]||0,n=clone(); if(v===0)delete n.pct[id]; else n.pct[id]=v;
    if(!allowed(n)){r.value=s.indexOf(old);potFx("shake");toast("🔒 Het potje is leeg. Maak eerst ergens anders geld vrij.");return;}

function collectPlan(){

  for(const id in st.pct){const i=ITEMS[id],p=st.pct[id],v=-p/100*net(i);
    (p<0?cuts:ups).push({key:id,n:i.n,thema:themaOf(id),pct:p,v,t:"S",txt:p<0?((p===-100?"De gemeente stopt hiermee. ":"")+i.stop):(i.up||"Meer geld voor "+i.n.toLowerCase()+".")});}
  for(const id in st.tax){const t=TAX.find(x=>x.id===id),p=st.tax[id],v=p/100*t.r;
    (p>0?cuts:ups).push({key:id,n:t.n+(p>0?" verhogen":" verlagen")+` (${p>0?"+":""}${p}%)`,thema:p>0?"Hogere lasten":"Lagere lasten",v,t:"S",txt:p<0?`De ${t.n.toLowerCase()} gaat ${-p}% omlaag. Dat scheelt inwoners en ondernemers € ${mln1(-v)} miljoen per jaar.`:`De ${t.n.toLowerCase()} gaat ${p}% omhoog. Dat levert € ${mln1(v)} miljoen per jaar op.`});}
  for(const id of st.cards){const c=CARDS.find(x=>x.id===id);(c.s>0?cuts:ups).push({key:id,n:c.n,thema:c.s>0?(c.t==="I"?"Verkopen en projecten stoppen":"Beleidskeuzes"):"Investeren in de toekomst",v:c.s,t:c.t,txt:c.d});}
  const {chains}=calc(); chains.forEach(c=>(c.v>0?cuts:ups).push({key:"chain-"+c.t,n:"Kettingeffect: "+c.t.toLowerCase(),thema:"Kettingeffecten",v:c.v,t:"S",txt:"⚠︎ Voorbeeldbedrag uit de game, nog te onderbouwen.",chain:1}));
  cuts.sort((a,b)=>b.v-a.v); ups.sort((a,b)=>a.v-b.v);

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const mln=v=>Math.abs(v).toLocaleString("nl-NL",{minimumFractionDigits:1,maximumFractionDigits:3});

function defaultIntro(plan,S,I,meta){
  const tc=plan.cuts.filter(x=>!x.chain).reduce((a,x)=>a+x.v,0), tu=plan.ups.filter(x=>!x.chain).reduce((a,x)=>a-x.v,0);

}

   <table class="saldo"><tbody><tr><td>Saldo structureel (elk jaar)</td><td class="r">${S<0?"−":""}${mln(S)}</td></tr><tr><td>Saldo eenmalig (2026)</td><td class="r">${I<0?"−":""}${mln(I)}</td></tr></tbody></table>
